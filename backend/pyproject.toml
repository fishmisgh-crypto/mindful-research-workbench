[project]
name = "mindful-workbench"
version = "0.1.0"
description = "Independent Python reproduction of the MINDFUL neural-instability method, with a local research API."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "h5py>=3.12",
    "pyarrow>=18",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app", "mindful"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "h5py.*", "sklearn.*"]
ignore_missing_imports = true
